<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GeoRemind Dashboard — Live map geofencing, proximity reminders, and trigger event tracking.">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.svg">

  <title>Dashboard — GeoRemind</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-layout">

  <!-- Ambient Background Glow -->
  <div class="ambient-glow glow-purple" style="opacity: 0.25;"></div>
  <div class="ambient-glow glow-cyan" style="opacity: 0.25;"></div>

  <!-- Top Glassmorphic Navigation Bar -->
  <header class="dash-navbar">
    <div class="nav-left">
      <!-- Mobile Sidebar Toggle -->
      <button id="mobile-sidebar-toggle" class="btn-icon mobile-nav-toggle" aria-label="Toggle Navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="dashboard.html" class="brand-logo" style="font-size: 1.2rem;">
        <div class="brand-icon" style="width: 32px; height: 32px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
            <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
        <span>Geo<span class="gradient-text">Remind</span></span>
      </a>

      <!-- Realtime Status Indicators -->
      <div class="nav-status-indicators">
        <div class="nav-indicator-pill" title="Websocket Connection Status">
          <span id="socket-status-dot" class="status-dot yellow"></span>
          <span id="socket-status-text">Connecting...</span>
        </div>
        <div class="nav-indicator-pill" title="GPS Location Tracker">
          <span id="gps-status-dot" class="status-dot yellow"></span>
          <span id="gps-status-text">GPS Idle</span>
        </div>
      </div>
    </div>

    <div class="nav-right">
      <!-- User Profile Badge -->
      <div class="user-profile-badge">
        <div id="nav-user-avatar" class="user-avatar">U</div>
        <span id="nav-user-name" class="user-name-text">Loading...</span>
      </div>

      <!-- Logout Button -->
      <button id="btn-logout" class="btn btn-secondary btn-sm" title="Log Out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area: Sidebar + Interactive Leaflet Map -->
  <div class="dash-content">

    <!-- Left Collapsible Glass Sidebar -->
    <aside class="dash-sidebar">

      <!-- Navigation Tabs -->
      <div class="sidebar-tabs" role="tablist">
        <button id="tab-btn-reminders" class="sidebar-tab-btn active" type="button" role="tab">
          <span>Reminders</span>
          <span id="badge-tab-reminders" class="tab-badge">0</span>
        </button>
        <button id="tab-btn-geofences" class="sidebar-tab-btn" type="button" role="tab">
          <span>Geofences</span>
          <span id="badge-tab-geofences" class="tab-badge">0</span>
        </button>
        <button id="tab-btn-history" class="sidebar-tab-btn" type="button" role="tab">
          <span>History</span>
          <span id="badge-tab-history" class="tab-badge">0</span>
        </button>
      </div>

      <!-- Quick Search Filter -->
      <div class="sidebar-search">
        <div style="position: relative;">
          <span class="form-icon" style="left: 0.75rem;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="sidebar-search-input" class="form-control" placeholder="Search reminders or zones..." style="padding-left: 2.25rem;">
        </div>
      </div>

      <!-- Scrollable List Sections -->
      <div class="sidebar-scroll-area">

        <!-- 1. Reminders Section -->
        <div id="reminders-section">
          <div id="reminders-container" style="display: flex; flex-direction: column; gap: 0.75rem;">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- 2. Geofences Section -->
        <div id="geofences-section" style="display: none;">
          <div id="geofences-container" style="display: flex; flex-direction: column; gap: 0.75rem;">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- 3. Trigger History Section -->
        <div id="history-section" style="display: none;">
          <div id="history-container" style="display: flex; flex-direction: column; gap: 0.75rem;">
            <!-- Rendered dynamically -->
          </div>
        </div>

      </div>
    </aside>

    <!-- Map Workspace Wrap -->
    <main class="dash-map-wrap">

      <!-- Leaflet Map Container -->
      <div id="map"></div>

      <!-- Floating Map Controls Overlay -->
      <div class="map-floating-panel">
        <button id="btn-map-locate" class="map-control-btn" title="Center map to my current GPS location">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Locate Me</span>
        </button>
      </div>

      <!-- Interactive Map Tip Pill -->
      <div class="map-tip-pill">
        <span>💡</span>
        <span>Click anywhere on the map to drop a new <span class="highlight">geofence reminder</span></span>
      </div>

      <!-- Floating Action Button (FAB) -->
      <button id="fab-add" class="fab" title="Create New Geofence + Reminder" aria-label="Add reminder">
        <div class="fab-pulse"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

    </main>
  </div>

  <!-- ==========================================
       Add Geofence + Reminder Modal
       ========================================== -->
  <div id="add-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">
          <span style="display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; background:var(--accent-gradient);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          </span>
          <span>Add Location Reminder</span>
        </h3>
        <button id="btn-close-modal" class="modal-close-btn" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="form-add-reminder">
        <div class="modal-body">

          <!-- Select Existing Geofence or Create New -->
          <div class="form-group">
            <label class="form-label" for="modal-existing-geofence">Target Geofence</label>
            <select id="modal-existing-geofence" class="form-control no-icon">
              <option value="">-- Create New Geofence --</option>
            </select>
          </div>

          <!-- New Geofence Specific Fields -->
          <div id="new-geofence-fields">
            <div class="form-group">
              <label class="form-label" for="geo-name">Geofence Name</label>
              <div style="position: relative;">
                <span class="form-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </span>
                <input type="text" id="geo-name" class="form-control" placeholder="e.g., Downtown Office, Whole Foods">
              </div>
            </div>

            <!-- Coordinates Row -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem;">
              <div class="form-group">
                <label class="form-label" for="geo-lat">Latitude</label>
                <input type="number" step="any" id="geo-lat" class="form-control no-icon" placeholder="37.7749">
              </div>
              <div class="form-group">
                <label class="form-label" for="geo-lng">Longitude</label>
                <input type="number" step="any" id="geo-lng" class="form-control no-icon" placeholder="-122.4194">
              </div>
            </div>

            <!-- Use current location quick button -->
            <div style="margin-bottom: 1.25rem;">
              <button type="button" id="btn-use-current-loc" class="btn btn-secondary btn-sm" style="width: 100%;">
                📍 Use My Current Location
              </button>
            </div>

            <!-- Radius Slider -->
            <div class="form-group">
              <div class="range-slider-container">
                <div class="range-slider-header">
                  <span>Geofence Radius</span>
                  <span id="geo-radius-val" class="range-slider-value">200 m</span>
                </div>
                <input type="range" id="geo-radius" class="range-slider" min="50" max="3000" step="25" value="200">
                <div style="display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-muted);">
                  <span>50m (Immediate)</span>
                  <span>1500m</span>
                  <span>3000m (City area)</span>
                </div>
              </div>
            </div>
          </div>

          <hr style="border: 0; border-top: 1px solid var(--border-glass); margin: 1.25rem 0;">

          <!-- Reminder Details -->
          <div class="form-group">
            <label class="form-label" for="reminder-message">Reminder Message</label>
            <div style="position: relative;">
              <span class="form-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              </span>
              <input type="text" id="reminder-message" class="form-control" placeholder="e.g., Pick up oat milk & mail parcel" required>
            </div>
          </div>

          <!-- Trigger Type Selection -->
          <div class="form-group">
            <label class="form-label" for="reminder-trigger-type">Trigger Condition</label>
            <select id="reminder-trigger-type" class="form-control no-icon">
              <option value="ENTER">On Arrival (When Entering Zone)</option>
              <option value="EXIT">On Departure (When Leaving Zone)</option>
              <option value="DWELL">On Staying (While Remaining Inside)</option>
            </select>
          </div>

          <!-- Recurring Toggle Switch -->
          <div class="form-group" style="margin-bottom: 0.5rem;">
            <label class="switch-label">
              <div>
                <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">Repeat Reminders</div>
                <div style="font-size: 0.78rem; color: var(--text-secondary);">Keep active every time you enter or exit</div>
              </div>
              <label class="switch">
                <input type="checkbox" id="reminder-recurring" checked>
                <span class="slider"></span>
              </label>
            </label>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" id="btn-cancel-modal" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="btn-modal-submit" class="btn btn-primary">Save Reminder</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>


<!-- Dependencies -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>

<!-- Application Modules -->
<script src="js/auth.js"></script>
<script src="js/socket.js?v=2"></script>
<script src="js/geolocation.js"></script>
<script src="js/dashboard.js"></script>
